<!DOCTYPE html>
<html>
<head>
    <title>Çavuş Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Çavuş Game</h1>

<div id="menu">
    <h2>Select Mode</h2>
    <button id="storyBtn">Story Mode</button>
    <button id="endlessBtn">Endless Mode</button>
    <button onclick="startMusicMode()">Music Mode</button>

    <div id="difficulty-selection" style="display:none;">
        <h2>Select Difficulty</h2>
        <div id="difficulty-buttons"></div>
    </div>
</div>

<div id="hud" style="display:none;">
    <div id="score">Score: 0</div>
    <div id="combo">Combo: 0</div>
    <div id="miss">Miss: 0</div>
    <div id="accuracy">Accuracy: 100%</div>

    <div id="health-container">
        <div id="health-bar"></div>
    </div>
</div>

<div id="game" style="display:none;">
    <div class="lane" id="lane0"></div>
    <div class="lane" id="lane1"></div>
    <div class="lane" id="lane2"></div>
    <div class="lane" id="lane3"></div>
    <div id="hit-line"></div>
</div>

<!-- Script -->
<script src="script.js"></script>

<!-- Müzik dosyası: Eye of the Tiger -->
<audio id="game-music" src="music/eye_of_the_tiger.mp3"></audio>

</body>
</html>
