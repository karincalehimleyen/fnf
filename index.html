<!DOCTYPE html>
<html>
<head>
    <title>Çavuş Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Çavuş Game</h1>

<div id="menu">
    <h2>Select Mode</h2>
    <button onclick="startMode('story')">Story Mode</button>
    <button onclick="startMode('endless')">Endless Mode</button>
    <button onclick="showMusicMenu()">Music Mode</button>

    <div id="musicMenu" style="display:none;">
        <h3>Select Song</h3>
        <button onclick="selectSong()">Eye of the Tiger</button>
        <button onclick="startMode('music')">Start Music Mode</button>
    </div>
</div>

<div id="hud" style="display:none;">
    <div id="score">Score: 0</div>
    <div id="combo">Combo: 0</div>
    <div id="miss">Miss: 0</div>
    <div id="accuracy">Accuracy: 100%</div>

    <div id="health-container">
        <div id="health-bar"></div>
    </div>
</div>

<div id="game" style="display:none;">
    <div class="lane" id="lane0"></div>
    <div class="lane" id="lane1"></div>
    <div class="lane" id="lane2"></div>
    <div class="lane" id="lane3"></div>
    <div id="hit-line"></div>
</div>

<audio id="game-music" src="music/eye_of_the_tiger.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
